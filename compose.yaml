services:
  init-storage:
    image: alpine:3
    network_mode: none
    user: '0:0'
    command: ['sh', '-c', 'chown 10001:10001 /data /archives /run/backupcenter && chmod 700 /data /archives && chmod 2770 /run/backupcenter']
    volumes:
      - ${BACKUPCENTER_DATA_DIR:-./.private/data}:/data
      - ${BACKUPCENTER_ARCHIVES_DIR:-./.private/archives}:/archives
      - runtime:/run/backupcenter
  backupcenter:
    image: backupcenter:local
    build: .
    restart: unless-stopped
    depends_on:
      init-storage:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 768m
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=10001,gid=10001,mode=700
    environment:
      BC_HOST: ${BACKUPCENTER_HOST:-backup.example.com}
      BC_SECURE_COOKIE: ${BACKUPCENTER_SECURE_COOKIE:-1}
      BC_SOCKET: /run/backupcenter/server.sock
      BC_DATA: /data
      BC_ARCHIVES: /archives
      BC_ARCHIVE_DISPLAY_PATH: ${BACKUPCENTER_ARCHIVES_DIR:-./.private/archives}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUPCENTER_DATA_DIR:-./.private/data}:/data
      - ${BACKUPCENTER_ARCHIVES_DIR:-./.private/archives}:/archives
      - runtime:/run/backupcenter
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '3'}
  proxy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    depends_on: [backupcenter]
    read_only: true
    security_opt: [no-new-privileges:true]
    ports:
      - '${BACKUPCENTER_BIND:-127.0.0.1}:${BACKUPCENTER_PORT:-8080}:8080'
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - runtime:/run/backupcenter:ro
volumes:
  runtime:
